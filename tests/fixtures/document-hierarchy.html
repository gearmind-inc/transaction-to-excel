<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>見出し階層の合成文書</title>
<style>body{font:16px sans-serif;line-height:1.6;margin:24px}main{padding:24px;border:1px solid #999}section{margin:24px 0}footer{margin-top:24px;padding:16px;border-top:1px solid #888}pre{white-space:pre-wrap}</style></head>
<body>
<main id="hierarchical-document">
<h1>合成ガイド</h1>
<p>これは合成の文書です。</p>
<p>表示内容を取り込みます。</p>
<p hidden>do-not-capture-hidden</p>
<input type="password" value="do-not-capture-password">
<section>
<h2>準備</h2>
<p>ページを開きます。</p>
<p>範囲を選びます。</p>
<p>表を確認します。</p>
<p>保存先を決めます。</p>
<section><h3>用語</h3>
<dl><dt>範囲</dt><dd>選んだHTMLの領域。</dd><dt>列</dt><dd>一つの項目。</dd></dl>
</section></section>
<section><h2>操作</h2>
<ul><li>見出しを押します。</li><li>列名を変更します。</li></ul>
<section><h3>例</h3>
<pre>run --csv
  --output sample.csv</pre>
</section></section>
</main>
<footer><p>この文書は合成です。</p></footer>
</body></html>
