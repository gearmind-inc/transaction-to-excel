<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    16px toolbar icon, drawn pixel by pixel: every rect sits on whole pixels so nothing is blurred.
    Only two shapes: the page table (left) and the CSV document (right), both with a dark outline
    and a light fill so they read on light and dark toolbars.
  -->
  <!-- Page table: cols 0-6, rows 3-11 -->
  <rect x="0" y="3" width="7" height="9" fill="#123e72"/>
  <rect x="1" y="4" width="5" height="2" fill="#2f7fd0"/>
  <rect x="1" y="6" width="5" height="5" fill="#fff"/>
  <rect x="3" y="6" width="1" height="5" fill="#5479b8"/>
  <rect x="1" y="8" width="5" height="1" fill="#5479b8"/>

  <!-- CSV document with a cut corner: cols 8-15, rows 1-14 -->
  <rect x="8" y="1" width="5" height="1" fill="#123e72"/>
  <rect x="13" y="2" width="1" height="1" fill="#123e72"/>
  <rect x="14" y="3" width="1" height="1" fill="#123e72"/>
  <rect x="15" y="4" width="1" height="11" fill="#123e72"/>
  <rect x="8" y="2" width="1" height="13" fill="#123e72"/>
  <rect x="9" y="14" width="6" height="1" fill="#123e72"/>
  <rect x="9" y="2" width="4" height="1" fill="#dcf1e7"/>
  <rect x="9" y="3" width="5" height="1" fill="#dcf1e7"/>
  <rect x="9" y="4" width="6" height="10" fill="#dcf1e7"/>
  <rect x="10" y="5" width="4" height="1" fill="#0a6156"/>
  <rect x="10" y="8" width="4" height="1" fill="#0a6156"/>
  <rect x="10" y="11" width="3" height="1" fill="#0a6156"/>
</svg>
